[package]
name = "boii"
version = "0.1.0"
edition = "2024"

[dependencies]
raylib = { version = "6.0.0", features = ["wayland"] }

[lints.clippy]
# todo = "warn"
# unwrap_used = "warn"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
