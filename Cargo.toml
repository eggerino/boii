[package]
name = "boii"
version = "0.1.0"
edition = "2024"

[features]
default = ["headless"]
headless = []
raylib = ["dep:raylib"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
raylib = { version = "6.0.0", optional = true }

[lints.clippy]
# todo = "warn"
# unwrap_used = "warn"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
